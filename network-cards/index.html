<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Network Cards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="conn-banner" class="conn-banner hidden" role="alert" aria-live="assertive"></div>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⬡</span>
      <div class="brand-text">
        <h1>Network Cards</h1>
        <span class="byline">by <span class="byline-name">TCPNETS</span></span>
      </div>
    </div>

    <div class="status-cluster">
      <div id="summary" class="summary"></div>
      <div class="history" id="history">
        <button id="history-btn" class="f-reset history-btn" type="button" title="Recent status changes (this session)" aria-label="Recent status changes"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.4V8l2.6 1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div id="history-popover" class="history-popover hidden"></div>
      </div>
    </div>

    <div class="top-actions">
      <div class="help">
        <button id="help-btn" class="help-btn" type="button" aria-label="Show shortcuts" title="Shortcuts">?</button>
        <div id="help-popover" class="help-popover hidden">
          <ul>
            <li>Click a card to flip</li>
            <li>Double-click to SSH</li>
            <li>Ctrl + double-click for web UI</li>
          </ul>
        </div>
      </div>
      <button id="alerts-toggle" class="alerts-toggle" type="button">🔔 Alerts On</button>
      <div class="settings" id="settings">
        <button id="settings-btn" class="f-reset settings-btn" type="button" title="Settings" aria-label="Settings"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/><path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/></svg></button>
        <div id="settings-popover" class="settings-popover hidden">
          <label class="set-row">Account
            <input id="account" type="text" placeholder="admin" autocomplete="off" spellcheck="false" />
          </label>
          <div class="set-row">SSH client
            <button id="ssh-os-toggle" class="alerts-toggle ssh-os-toggle" type="button"></button>
          </div>
          <div class="set-row">IP addresses
            <button id="f-hide-ip" class="f-reset f-hide-ip" type="button" title="Hide IP addresses" aria-label="Toggle IP visibility"></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="filters">
    <label class="f-search">Search
      <input id="f-search" type="search" placeholder="hostname, IP, URL…" autocomplete="off" spellcheck="false" />
    </label>
    <div class="facet" id="facet-type" data-facet="type">
      <span class="facet-label">Type</span>
      <button class="facet-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="facet-summary">All</span><span class="caret">▾</span>
      </button>
      <div class="facet-pop hidden">
        <button type="button" class="chip chip-master" data-facet="type" data-master="1"></button>
        <div class="chips"></div>
      </div>
    </div>
    <div class="facet" id="facet-status" data-facet="status">
      <span class="facet-label">Status</span>
      <button class="facet-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="facet-summary">All</span><span class="caret">▾</span>
      </button>
      <div class="facet-pop hidden">
        <button type="button" class="chip chip-master" data-facet="status" data-master="1"></button>
        <div class="chips"></div>
      </div>
    </div>
    <div class="facet" id="facet-site" data-facet="site">
      <span class="facet-label">Site</span>
      <button class="facet-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="facet-summary">All</span><span class="caret">▾</span>
      </button>
      <div class="facet-pop hidden">
        <button type="button" class="chip chip-master" data-facet="site" data-master="1"></button>
        <div class="chips"></div>
      </div>
    </div>
    <div class="facet" id="facet-sort">
      <span class="facet-label">Sort</span>
      <button class="facet-btn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="facet-summary">Dynamic (status)</span><span class="caret">▾</span>
      </button>
      <div class="facet-pop hidden">
        <div class="chips sort-chips">
          <button type="button" class="chip sort-opt" data-val="dynamic">Dynamic (status)</button>
          <button type="button" class="chip sort-opt" data-val="recent">Recent change</button>
          <button type="button" class="chip sort-opt" data-val="hostname">Hostname</button>
          <button type="button" class="chip sort-opt" data-val="site">Site</button>
          <button type="button" class="chip sort-opt" data-val="type">Type</button>
        </div>
      </div>
    </div>
    <button id="f-reset" class="f-reset" type="button" title="Reset filters" aria-label="Reset filters">↺</button>
  </div>

  <main id="grid" class="grid"></main>
  <p id="empty" class="empty hidden">No devices match these filters.</p>

  <!-- Tiny toast for the (placeholder) SSH action -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
